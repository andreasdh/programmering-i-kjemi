name: Polish numerical notebooks

on:
  push:
    branches:
      - agent/polish-numerical-methods

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/polish-numerical-methods

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib nbformat nbclient ipykernel

      - name: Polish and execute notebooks
        env:
          MPLBACKEND: Agg
        run: python scripts/polish_numerical_methods.py

      - name: Store executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nullpunkter_likninger/likninger.ipynb
          git add docs/derivasjon_integrasjon/derivasjon.ipynb
          git add docs/derivasjon_integrasjon/integrasjon.ipynb
          git add docs/modellering/diskret_modellering.ipynb
          git add docs/modellering/differensiallikninger.ipynb
          git rm scripts/polish_numerical_methods.py
          git rm .github/workflows/polish-numerical-methods.yml
          git commit -m "Finpuss numeriske metoder og lagre output"
          git push origin HEAD:agent/polish-numerical-methods
