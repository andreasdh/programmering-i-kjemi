name: Restore numerical pedagogy

on:
  push:
    branches:
      - agent/numerical-methods-formatting
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  revise-and-run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/numerical-methods-formatting
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: python -m pip install --upgrade nbformat nbclient ipykernel numpy scipy matplotlib matplotlib-inline pandas

      - name: Patch revision script
        run: |
          sed -i 's/## Ferdige metoder/## Ferdige løsere i SciPy/' scripts/_restore_numeric_pedagogy.py
          sed -i 's/nullpunkt = (x + x + dx)\/2/nullpunkt = (x + (x + dx))\/2/' scripts/_restore_numeric_pedagogy.py
          sed -i 's/text(c).lstrip().startswith(heading)/heading in text(c)/' scripts/_restore_numeric_pedagogy.py
          sed -i 's/## Koblede differensiallikninger/## Koblede fartslover/' scripts/_restore_numeric_pedagogy.py

      - name: Restore pedagogical progression
        run: python scripts/_restore_numeric_pedagogy.py

      - name: Execute all notebooks
        env:
          MPLBACKEND: module://matplotlib_inline.backend_inline
        run: python scripts/_execute_numeric_pedagogy.py

      - name: Remove temporary files
        run: |
          rm scripts/_restore_numeric_pedagogy.py
          rm scripts/_execute_numeric_pedagogy.py
          rm .github/workflows/restore-numeric-pedagogy.yml

      - name: Commit notebook changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gjenopprett pedagogisk progresjon i numeriske kapitler"
          git push origin HEAD:agent/numerical-methods-formatting
