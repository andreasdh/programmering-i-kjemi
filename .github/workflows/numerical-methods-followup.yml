name: Numerical methods follow-up

on:
  push:
    branches:
      - agent/numerical-methods-formatting
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  revise-and-execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/numerical-methods-formatting
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: python -m pip install --upgrade nbformat nbclient ipykernel numpy scipy matplotlib pandas

      - name: Revise and execute notebooks
        env:
          MPLBACKEND: Agg
        run: python scripts/_apply_numeric_followup.py

      - name: Remove temporary revision files
        run: |
          rm scripts/_apply_numeric_followup.py
          rm .github/workflows/numerical-methods-followup.yml

      - name: Commit notebook changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Juster formatering og kjør numeriske notebooks"
            git push origin HEAD:agent/numerical-methods-formatting
          fi
