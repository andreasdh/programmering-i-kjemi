name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: install
        run: |
          python --version
          python -m pip install setuptools
          python -m pip install -r requirements.txt
          python -m pip install attrs

      - name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          cd $GITHUB_WORKSPACE
          git init
          git config user.name "Github Actions"
          git config user.email "github-actions-bot@users.noreply.github.com"
          REPOSITORY_PATH="https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout master
          jupyter-book build .
      - name: Install and customize Basthon
        run: |
          basthon_dir="_build/html/basthon"
          basthon_archive="$RUNNER_TEMP/basthon-console.tgz"
          mkdir -p "$basthon_dir"

          basthon_urls=(
            "https://console-basthon.sct.pf/basthon-console.tgz"
            "https://console.basthon.fr/basthon-console.tgz"
          )
          downloaded=false
          for basthon_url in "${basthon_urls[@]}"; do
            echo "Downloading Basthon from $basthon_url"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 240 \
              --output "$basthon_archive" "$basthon_url"; then
              if tar -tzf "$basthon_archive" > /dev/null; then
                downloaded=true
                break
              fi
              echo "Downloaded file is not a valid gzip archive"
            fi
          done

          if [ "$downloaded" != true ]; then
            echo "Could not download a valid Basthon Console archive" >&2
            exit 1
          fi

          tar -xzf "$basthon_archive" -C "$basthon_dir"
          mkdir -p "$basthon_dir/examples"
          cp docs/_static/basthon_examples/*.py "$basthon_dir/examples/"
          basthon_js=$(find "$basthon_dir/assets" -maxdepth 1 -type f \
            -name 'main.*.js' ! -name '*.map' -print -quit)
          test -n "$basthon_js"
          python scripts/customize_basthon.py \
            "$basthon_dir/index.html" "$basthon_js"
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
