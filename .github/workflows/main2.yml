name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: install
        run: |
          python --version
          python -m pip install setuptools
          python -m pip install -r requirements.txt
          python -m pip install attrs

      - name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          cd $GITHUB_WORKSPACE
          git init
          git config user.name "Github Actions"
          git config user.email "github-actions-bot@users.noreply.github.com"
          REPOSITORY_PATH="https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout master
          jupyter-book build .
      - name: Install and customize Basthon
        run: |
          basthon_dir="_build/html/basthon"
          mkdir -p "$basthon_dir"
          curl --fail --location --silent --show-error --retry 3 \
            https://console.basthon.fr/basthon-console.tgz \
            | tar -xz -C "$basthon_dir"
          mkdir -p "$basthon_dir/examples"
          cp docs/_static/basthon_examples/*.py "$basthon_dir/examples/"
          basthon_js=$(find "$basthon_dir/assets" -maxdepth 1 -type f \
            -name 'main.*.js' ! -name '*.map' -print -quit)
          test -n "$basthon_js"
          python scripts/customize_basthon.py \
            "$basthon_dir/index.html" "$basthon_js"
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
