name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Install dependencies
        run: |
          python --version
          python -m pip install setuptools
          python -m pip install -r requirements.txt
          python -m pip install attrs

      - name: Repair exercise sections
        if: ${{ hashFiles('scripts/repair_exercise_sections.py') != '' }}
        run: python scripts/repair_exercise_sections.py

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Prepare Basthon
        run: bash scripts/prepare_basthon.sh "_build/html/basthon"

      - name: Store generated repository changes
        run: |
          changed=false

          if [[ -f scripts/repair_exercise_sections.py ]]; then
            git add docs/grunnleggende_programmering/lister.ipynb
            git add docs/grunnleggende_programmering/funksjoner.ipynb
            git add docs/grunnleggende_programmering/datasamlinger.ipynb
            git rm scripts/repair_exercise_sections.py
            changed=true
          fi

          if [[ -n "$(git status --porcelain -- vendor/basthon/basthon-console-custom.tgz vendor/basthon/basthon-console-custom.tgz.sha256)" ]]; then
            git add vendor/basthon/basthon-console-custom.tgz
            git add vendor/basthon/basthon-console-custom.tgz.sha256
            changed=true
          fi

          if [[ "$changed" == true ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Repair exercise sections and solutions [skip ci]"
            git push origin HEAD:master
          else
            echo "No generated repository changes"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
