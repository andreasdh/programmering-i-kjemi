name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python --version
          python -m pip install setuptools
          python -m pip install -r requirements.txt
          python -m pip install attrs

      - name: Repair malformed Datasamlinger fence
        run: python scripts/fix_datasamlinger_fence.py

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Add project-root redirect
        run: |
          cat > _build/html/index.html <<'EOF'
          <!doctype html>
          <html lang="nb">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=docs/intro.html">
              <link rel="canonical" href="docs/intro.html">
              <title>Programmering i kjemi</title>
            </head>
            <body>
              <p><a href="docs/intro.html">Gå til Programmering i kjemi</a></p>
            </body>
          </html>
          EOF

      - name: Verify book output
        run: |
          test -f _build/html/index.html
          test -f _build/html/docs/intro.html
          test -d _build/html/_static

      - name: Prepare Basthon
        run: bash scripts/prepare_basthon.sh "_build/html/basthon"

      - name: Verify complete publish directory
        run: |
          test -f _build/html/index.html
          test -f _build/html/docs/intro.html
          test -f _build/html/basthon/index.html

      - name: Store generated repository changes
        run: |
          changed=false

          if [[ -n "$(git status --porcelain -- docs/grunnleggende_programmering/datasamlinger.ipynb)" ]]; then
            git add docs/grunnleggende_programmering/datasamlinger.ipynb
            changed=true
          fi

          if [[ -n "$(git status --porcelain -- vendor/basthon/basthon-console-custom.tgz vendor/basthon/basthon-console-custom.tgz.sha256)" ]]; then
            git add vendor/basthon/basthon-console-custom.tgz
            git add vendor/basthon/basthon-console-custom.tgz.sha256
            changed=true
          fi

          if [[ "$changed" == true ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Repair generated site assets [skip ci]"
            git push origin HEAD:master
          else
            echo "No generated repository changes"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
