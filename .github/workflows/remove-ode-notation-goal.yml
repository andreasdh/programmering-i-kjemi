name: Remove ODE notation learning goal

on:
  push:
    branches:
      - agent/polish-numerical-methods

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/polish-numerical-methods

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update notebook
        run: python scripts/remove_ode_notation_learning_goal.py

      - name: Store final notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modellering/differensiallikninger.ipynb
          git rm scripts/remove_ode_notation_learning_goal.py
          git rm .github/workflows/remove-ode-notation-goal.yml
          git commit -m "Fjern notasjon som eget læringsmål"
          git push origin HEAD:agent/polish-numerical-methods
