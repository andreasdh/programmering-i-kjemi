name: Numerical inline output

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  execute-inline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/numerical-methods-formatting
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: python -m pip install --upgrade nbformat nbclient ipykernel numpy scipy matplotlib pandas matplotlib-inline

      - name: Execute notebooks with inline figures
        env:
          MPLBACKEND: module://matplotlib_inline.backend_inline
        run: python scripts/_rerun_numeric_inline.py

      - name: Remove temporary files
        run: |
          rm scripts/_rerun_numeric_inline.py
          rm .github/workflows/numerical-inline-output.yml

      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lagre inline-output fra numeriske notebooks"
          git push origin HEAD:agent/numerical-methods-formatting
