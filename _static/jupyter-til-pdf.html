<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jupyter til PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: sticky control panel beside an A4 sheet lying on a graph-paper desk; dashed rules on the sheet mark PDF page breaks */
:root {
  --desk: #e6e9ee; --desk-grid: #dce1e8; --panel: #f8f9fb; --ink: #161b24; --muted: #576172; --line: #d1d7e0;
  --accent: #2442c9; --accent-ink: #ffffff; --accent-soft: #e3e8fb;
  --ok: #1b7643; --ok-soft: #e1f2e8; --warn: #95590a; --warn-soft: #fbefd9; --err: #bb3127; --err-soft: #fbe5e2;
  --shadow: 0 1px 2px rgb(20 28 45 / .08), 0 10px 30px rgb(20 28 45 / .12);
  /* The sheet is white paper in both themes */
  --paper: #ffffff; --paper-ink: #15181e; --paper-muted: #636c7a; --paper-rule: #d9dee6; --pb: #8f9bb0;
  --code-bg: #f3f5f8; --code-border: #dfe4eb; --code-ink: #1b2130; --prompt-out: #a3401a;
  --hl-kw: #8a2b9e; --hl-str: #1d7238; --hl-num: #1c5cb5; --hl-com: #6a7485; --hl-fn: #8a4f00; --hl-bi: #0d6c75; --hl-meta: #9b3a10;
  --stderr-bg: #fdf4f3; --error-bg: #fdf0ef; --error-border: #f0cbc6; --fail-ink: #b3261e; --fail-bg: #fdeceb;
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-doc: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #101318; --desk-grid: #171b22; --panel: #181c24; --ink: #e5e8ee; --muted: #99a2b2; --line: #2a303b;
    --accent: #93a6ff; --accent-ink: #0c1230; --accent-soft: #222a4b;
    --ok: #5fc48d; --ok-soft: #16301f; --warn: #e6aa4e; --warn-soft: #362910; --err: #ff7d71; --err-soft: #3a1b18;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #101318; --desk-grid: #171b22; --panel: #181c24; --ink: #e5e8ee; --muted: #99a2b2; --line: #2a303b;
  --accent: #93a6ff; --accent-ink: #0c1230; --accent-soft: #222a4b;
  --ok: #5fc48d; --ok-soft: #16301f; --warn: #e6aa4e; --warn-soft: #362910; --err: #ff7d71; --err-soft: #3a1b18;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--desk);
  background-image: linear-gradient(var(--desk-grid) 1px, transparent 1px), linear-gradient(90deg, var(--desk-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 400 14.5px/1.5 var(--font-ui);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 1440px; margin: 0 auto;
  padding-block: 22px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0; font: 700 23px/1.15 var(--font-ui); letter-spacing: -0.015em; text-wrap: balance; }
.ext-pair { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-mono); color: var(--muted); letter-spacing: 0; }
.ext { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 6px; }
.lede { margin: 0; color: var(--muted); max-width: 64ch; }

.layout { display: grid; grid-template-columns: minmax(290px, 344px) minmax(0, 1fr); gap: 22px; align-items: start; }
.panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
  max-height: calc(100vh - 32px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; display: flex; flex-direction: column; gap: 20px;
}
.panel h2 { margin: 0 0 9px; font: 600 11.5px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; }

.drop {
  position: relative; display: flex; flex-direction: column; gap: 3px;
  padding: 15px 16px; border: 1.5px dashed var(--line); border-radius: 8px; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.drop strong { color: var(--accent); font-weight: 600; font-size: 15px; }
.drop .hint { color: var(--muted); font-size: 13.5px; }
.file-name { margin-top: 7px; font: 12.5px/1.4 var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }

.fields { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 500; }
.field input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--desk);
}
.field input::placeholder { color: var(--muted); opacity: .8; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 4px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

.summary { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.summary li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; }
.summary li + li { border-top: 1px solid var(--line); }
.summary .k { font-weight: 600; font-size: 13.5px; }
.summary .v { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill { font: 600 11px/1 var(--font-ui); letter-spacing: .03em; padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
.pill[data-state="ok"] { color: var(--ok); background: var(--ok-soft); }
.pill[data-state="warn"] { color: var(--warn); background: var(--warn-soft); }
.pill[data-state="error"] { color: var(--err); background: var(--err-soft); }
.pill[data-state="off"] { color: var(--muted); background: transparent; border: 1px solid var(--line); }

.issues { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.issue {
  width: 100%; text-align: left; border: 0; border-radius: 7px; padding: 8px 10px 9px; cursor: pointer;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: baseline;
}
.issue[data-level="error"] { background: var(--err-soft); }
.issue[data-level="warn"] { background: var(--warn-soft); }
.issue .sev { font: 700 10.5px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .06em; }
.issue[data-level="error"] .sev { color: var(--err); }
.issue[data-level="warn"] .sev { color: var(--warn); }
.issue .msg { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.issue .where { grid-column: 2; font: 11.5px var(--font-mono); color: var(--muted); }
.issue .detail { grid-column: 2; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.issue code { font: 12px var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }
.issue:hover .msg { text-decoration: underline; text-underline-offset: 2px; }
.all-good { margin: 10px 0 0; padding: 9px 11px; border-radius: 7px; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: 13.5px; }
.check-note { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }

.actions { display: flex; flex-direction: column; gap: 8px; }
.primary {
  width: 100%; padding: 12px 16px; border: 0; border-radius: 8px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px;
}
.primary:disabled { opacity: .55; cursor: progress; }
.secondary { width: 100%; padding: 10px 16px; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; font-weight: 500; }
a.primary, a.secondary { display: block; text-align: center; text-decoration: none; color: inherit; overflow-wrap: anywhere; }
a.primary { color: var(--accent-ink); }
.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.status { margin: 0; min-height: 1.4em; font-size: 13px; color: var(--muted); }
.status[data-tone="ok"] { color: var(--ok); }
.status[data-tone="warn"] { color: var(--warn); }
.status[data-tone="error"] { color: var(--err); }

.stage { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.stage-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.stage-head strong { color: var(--ink); font-weight: 600; }
.legend { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 22px; border-top: 1.5px dashed var(--muted); }
.paper-wrap { position: relative; margin: 0 auto; }
.paper {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  width: 869px; padding: 66px 74.5px 83px;
  background: var(--paper); box-shadow: var(--shadow); border-radius: 2px;
}
.pb { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed var(--pb); pointer-events: none; }
.pb span { position: absolute; right: 12px; top: 0; transform: translateY(-50%); padding: 0 6px; background: var(--paper); color: var(--pb); font: 600 11px/1 var(--font-ui); letter-spacing: .04em; }

/* ---------- The document as it appears on paper ---------- */
.doc { width: 720px; display: flow-root; background: var(--paper); color: var(--paper-ink); font: 400 15px/1.55 var(--font-doc); text-align: left; }
.doc-inner { position: relative; }
.doc-inner > :first-child { margin-top: 0; }
.nb-title { margin: 0 0 24px; padding-bottom: 12px; border-bottom: 1px solid var(--paper-rule); }
.nb-title h1 { margin: 0 0 4px; font-size: 27px; line-height: 1.2; font-weight: 600; text-wrap: balance; }
.nb-title .meta { color: var(--paper-muted); font-size: 14px; font-style: italic; }
.nb-empty { color: var(--paper-muted); font-style: italic; }
.nb-cell { margin: 0 0 14px; }
.nb-md > :first-child { margin-top: 0; }
.nb-md > :last-child { margin-bottom: 0; }
.nb-md h1, .nb-md h2, .nb-md h3, .nb-md h4, .nb-md h5, .nb-md h6 { font-weight: 600; line-height: 1.25; text-wrap: balance; }
.nb-md h1 { font-size: 25px; margin: 28px 0 10px; }
.nb-md h2 { font-size: 20px; margin: 24px 0 8px; }
.nb-md h3 { font-size: 17px; margin: 18px 0 6px; }
.nb-md h4, .nb-md h5, .nb-md h6 { font-size: 15px; margin: 14px 0 4px; }
.nb-md p { margin: 0 0 10px; }
.nb-md ul, .nb-md ol { margin: 0 0 10px; padding-left: 26px; }
.nb-md li { margin: 2px 0; }
.nb-md li > p { margin: 0 0 4px; }
.nb-md blockquote { margin: 0 0 10px; padding: 1px 0 1px 14px; border-left: 3px solid var(--paper-rule); color: #3a414d; }
.nb-md code { font: 13px var(--font-mono); font-variant-ligatures: none; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
.nb-md pre { margin: 0 0 10px; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: 7px 10px; font: 12.5px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.nb-md pre code { background: none; padding: 0; font-size: inherit; }
.nb-md a { color: #1d4fb0; }
.nb-md hr { border: 0; border-top: 1px solid var(--paper-rule); margin: 16px 0; }
.nb-md img { max-width: 100%; max-height: 900px; }
.doc table { border-collapse: collapse; border: 0; margin: 4px 0 12px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.doc th, .doc td { border: 0; border-bottom: 1px solid var(--paper-rule); padding: 4px 10px; vertical-align: top; }
.doc thead th { border-bottom: 1.5px solid var(--paper-ink); }
.nb-md th, .nb-md td { text-align: left; }
.nb-html th, .nb-html td { text-align: right; }
.nb-html { font-size: 13.5px; overflow: hidden; }
.nb-html table { margin: 2px 0 4px; }
.doc mjx-container[jax="SVG"][display="true"] { margin: .5em 0; }
.nb-out-math mjx-container[jax="SVG"][display="true"] { text-align: left; margin: 2px 0; }
.math-fail { font: 12.5px/1.5 var(--font-mono); color: var(--fail-ink); background: var(--fail-bg); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.math-fail.block { display: block; margin: 6px 0; padding: 5px 9px; white-space: pre-wrap; }
.math-raw { font: 12.5px var(--font-mono); }

.nb-row { display: flex; gap: 8px; align-items: flex-start; }
.nb-row + .nb-row { margin-top: 6px; }
.nb-prompt { flex: 0 0 44px; padding-top: 8px; text-align: right; white-space: nowrap; font: 11px/1.5 var(--font-mono); color: var(--paper-muted); }
.nb-prompt.out { color: var(--prompt-out); padding-top: 1px; }
.no-prompts .nb-prompt { display: none; }
.nb-body { flex: 1 1 auto; min-width: 0; }
.nb-in { background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: 7px 10px; }
.nb-code, .nb-text { margin: 0; font: 12.5px/1.5 var(--font-mono); font-variant-ligatures: none; color: var(--code-ink); }
.nb-ln { display: block; min-height: 1.5em; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 2ch; text-indent: -2ch; }
.nb-text { padding: 0 11px; }
.nb-stderr { background: var(--stderr-bg); border-radius: 4px; padding: 5px 10px; }
.nb-error { background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 4px; padding: 7px 10px; }
.nb-trunc { color: var(--paper-muted); font-style: italic; }
.nb-img { display: block; max-width: 100%; height: auto; max-height: 900px; }
.nb-missing { display: block; margin: 4px 0; padding: 8px 12px; border: 1px dashed #c3cad6; border-radius: 4px; color: var(--paper-muted); font: 12.5px/1.4 var(--font-mono); }
.nb-flash { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 3px; animation: flash 1.8s ease-out forwards; }
@keyframes flash { 0%, 60% { outline-color: var(--accent); } 100% { outline-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .nb-flash { animation: none; } .drop, .progress span { transition: none; } }

/* syntax colours */
.hljs-keyword, .hljs-literal, .hljs-selector-tag, .hljs-doctag { color: var(--hl-kw); font-weight: 600; }
.hljs-string, .hljs-regexp, .hljs-template-tag { color: var(--hl-str); }
.hljs-number, .hljs-attr, .hljs-variable, .hljs-symbol { color: var(--hl-num); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-section { color: var(--hl-fn); }
.hljs-title.class_ { font-weight: 600; }
.hljs-built_in, .hljs-type { color: var(--hl-bi); }
.hljs-meta { color: var(--hl-meta); }
.hljs-subst, .hljs-params { color: inherit; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; overflow: visible; }
}

@media print {
  @page { size: A4; margin: 16mm 18mm 20mm; }
  body { background: #fff !important; }
  .bar, .panel, .stage-head, .pb { display: none !important; }
  .app, .layout, .stage { display: block; padding: 0; margin: 0; max-width: none; }
  .paper-wrap { width: auto !important; height: auto !important; }
  .paper { position: static; transform: none !important; width: auto; padding: 0; box-shadow: none; }
  .doc { width: auto; }
  .nb-ln, .nb-md p, .nb-md li, .doc tr, .nb-img, .nb-md img, mjx-container, .nb-title { break-inside: avoid; }
  .nb-md h1, .nb-md h2, .nb-md h3, .nb-md h4 { break-after: avoid; }
}
</style>

<script>
window.MathJax = {
  loader: { load: [] },
  tex: {
    packages: { '[+]': ['mhchem', 'cancel', 'color', 'boldsymbol', 'braket', 'bbox', 'upgreek'], '[-]': ['noundefined'] },
    tags: 'ams'
  },
  svg: { fontCache: 'none' },
  options: { enableAssistiveMml: false, menuOptions: { settings: { assistiveMml: false, explorer: false } } },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="brand">Jupyter til PDF <span class="ext-pair" aria-hidden="true"><span class="ext">.ipynb</span>→<span class="ext">.pdf</span></span></h1>
    <p class="lede">Last opp en notebook. Appen sjekker at kode, matematikk og tekst blir pent, og lager en A4-PDF du kan levere.</p>
  </header>

  <main class="layout">
    <aside class="panel">
      <fieldset id="controls">
        <section>
          <h2>Notebook</h2>
          <label class="drop" id="drop">
            <input type="file" id="file" accept=".ipynb,application/x-ipynb+json,application/json">
            <strong>Velg .ipynb-fil</strong>
            <span class="hint">eller dra den hit</span>
            <span class="file-name" id="fileName"></span>
          </label>
        </section>

        <section>
          <h2>Innhold</h2>
          <div class="fields">
            <div class="field">
              <label for="optTitle">Tittel</label>
              <input id="optTitle" type="text" placeholder="Valgfri, vises øverst" autocomplete="off">
            </div>
            <div class="field">
              <label for="optAuthor">Navn</label>
              <input id="optAuthor" type="text" placeholder="Navn eller kandidatnummer" autocomplete="off">
            </div>
          </div>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="optCode" checked> Ta med kode</label>
            <label class="toggle"><input type="checkbox" id="optOut" checked> Ta med utdata</label>
            <label class="toggle"><input type="checkbox" id="optPrompts" checked> Cellenummer</label>
            <label class="toggle"><input type="checkbox" id="optTrunc"> Forkort lange utdata</label>
          </div>
        </section>
      </fieldset>

      <section aria-live="polite">
        <h2>Sjekk</h2>
        <ul class="summary" id="summary"></ul>
        <div id="issueBox"></div>
      </section>

      <div class="actions">
        <button class="primary" id="pdfBtn" type="button">Last ned PDF</button>
        <a class="secondary" id="saveLink" hidden></a>
        <div class="progress" id="progress" hidden><span></span></div>
        <p class="status" id="status" role="status"></p>
      </div>
    </aside>

    <section class="stage" aria-label="Forhåndsvisning">
      <div class="stage-head">
        <span><strong>Forhåndsvisning</strong> · <span id="pageCount">A4</span></span>
        <span class="legend"><i></i> sideskift i PDF-en</span>
      </div>
      <div class="paper-wrap" id="paperWrap">
        <div class="paper" id="paper">
          <div class="doc" id="doc"><div class="doc-inner" id="docInner"></div></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="application/json" id="sampleNb">{"cells":[{"cell_type":"markdown","metadata":{},"source":["# Førsteordens kinetikk for H₂O₂\n","\n","Hydrogenperoksid brytes ned med $\\ce{MnO2}$ som katalysator:\n","\n","$$\\ce{2 H2O2 (aq) -> 2 H2O (l) + O2 (g)}$$\n","\n","For en førsteordens reaksjon er hastighetsloven $r = -\\dfrac{d[\\ce{H2O2}]}{dt} = k[\\ce{H2O2}]$. Integrert gir det\n","\n","$$\\ln[\\ce{H2O2}]_t = \\ln[\\ce{H2O2}]_0 - kt$$\n","\n","Vi skal\n","\n","1. lese inn målte konsentrasjoner,\n","2. finne $k$ ved lineær regresjon av $\\ln c$ mot $t$,\n","3. beregne halveringstiden $t_{1/2}$."]},{"cell_type":"code","execution_count":1,"metadata":{},"outputs":[],"source":["import numpy as np\n","import matplotlib.pyplot as plt\n","\n","t = np.array([0, 5, 10, 15, 20, 30, 40])                               # min\n","c = np.array([0.882, 0.699, 0.551, 0.437, 0.347, 0.217, 0.136])        # mol/L"]},{"cell_type":"markdown","metadata":{},"source":["## Lineær regresjon\n","\n","Stigningstallet til linjen er $-k$. Halveringstiden for en førsteordens reaksjon er uavhengig av startkonsentrasjonen:\n","\n","$$t_{1/2} = \\frac{\\ln 2}{k}$$"]},{"cell_type":"code","execution_count":2,"metadata":{},"outputs":[{"name":"stdout","output_type":"stream","text":["k = 0.0467 min^-1\n","t_1/2 = 14.8 min\n",""]}],"source":["stigning, konstantledd = np.polyfit(t, np.log(c), 1)\n","k = -stigning\n","t_halv = np.log(2) / k\n","print(f\"k = {k:.4f} min^-1\")\n","print(f\"t_1/2 = {t_halv:.1f} min\")"]},{"cell_type":"code","execution_count":3,"metadata":{},"outputs":[{"output_type":"display_data","metadata":{},"data":{"image/png":"iVBORw0KGgoAAAANSUhEUgAAAsAAAAFrCAYAAADfHD9fAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAQ6wAAEOsBUJTofAAAeftJREFUeJzt3Xd4FFUXx/HvpjdCS4BA6L1Kr9JBmgooUgQRFFB6sb6oINhQlK4oINIVkaaoKL333jspECAESCV93j9WFtYkNJNsyu/zPPPA3rkzc2ZZkpPJveeaDMMwEBERERHJJuxsHYCIiIiISHpSAiwiIiIi2YoSYBERERHJVpQAi4iIiEi2ogRYRERERLI <script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const els = {
    controls: $('#controls'), file: $('#file'), drop: $('#drop'), fileName: $('#fileName'),
    title: $('#optTitle'), author: $('#optAuthor'), code: $('#optCode'), out: $('#optOut'), prompts: $('#optPrompts'), trunc: $('#optTrunc'),
    summary: $('#summary'), issueBox: $('#issueBox'), pdfBtn: $('#pdfBtn'), saveLink: $('#saveLink'), progress: $('#progress'), status: $('#status'),
    wrap: $('#paperWrap'), paper: $('#paper'), doc: $('#doc'), inner: $('#docInner'), pageCount: $('#pageCount')
  };

  // A4 geometry. The rendered column is 720 CSS px wide and maps onto 174 mm.
  const MM = { pageW: 210, pageH: 297, side: 18, top: 16, bottom: 20 };
  const DOC_W = 720;
  const PX_PER_MM = DOC_W / (MM.pageW - 2 * MM.side);
  const PAGE_H = Math.floor((MM.pageH - MM.top - MM.bottom) * PX_PER_MM);
  const RENDER_SCALE = 2.5;
  const LONG_OUTPUT = 60, TRUNC_HEAD = 30, TRUNC_TAIL = 10;
  const MATH_ENV = /^(equation|align|alignat|gather|multline|flalign|eqnarray|displaymath|math)\*?$/;
  const URI_RE = /^(?:(?:(?:f|ht)tps?|mailto|tel|attachment):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i;
  const PURIFY = {
    FORBID_TAGS: ['style', 'script', 'iframe', 'object', 'embed', 'form', 'input', 'button', 'textarea', 'select', 'link', 'meta', 'base', 'video', 'audio'],
    FORBID_ATTR: ['id', 'name'], ALLOWED_URI_REGEXP: URI_RE
  };

  const state = { nb: null, fileName: '', issues: [], stats: null, pages: [[0, 0]], scale: 1, token: 0, busy: false, mathOk: false, cols: 86 };
  const framed = (() => { try { return window.self !== window.top; } catch { return true; } })();
  const downloadsCap = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

  // ---------- small helpers ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const joinSrc = s => Array.isArray(s) ? s.join('') : (s == null ? '' : String(s));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clip = (s, n) => (s = String(s).replace(/\s+/g, ' ').trim()).length > n ? s.slice(0, n - 1) + '…' : s;
  const svgUri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  const issue = (level, cat, cell, msg, detail, tex) => state.issues.push({ level, cat, cell, msg, detail, tex });

  function status(text, tone) { els.status.textContent = text || ''; els.status.dataset.tone = tone || ''; }

  // ---------- MathJax ----------
  let mathReady = null;
  function waitMath() {
    if (!mathReady) mathReady = (async () => {
      for (let i = 0; i < 100 && !(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise); i++) await sleep(100);
      if (!(window.MathJax && MathJax.startup && MathJax.startup.promise)) return false;
      await MathJax.startup.promise;
      try { document.head.appendChild(MathJax.svgStylesheet()); } catch (e) { /* styles are optional */ }
      return typeof MathJax.tex2svg === 'function';
    })().catch(() => false);
    return mathReady;
  }

  const TEX_ERR = [
    [/^Undefined control sequence (.+)$/, 'ukjent kommando $1'],
    [/^Missing close brace$/, 'mangler avsluttende }'],
    [/^Extra close brace or missing open brace$/, 'ekstra } eller manglende {'],
    [/^Extra open brace or missing close brace$/, 'ekstra { eller manglende }'],
    [/^Double exponent: use braces to clarify$/, 'dobbel eksponent, bruk { } for å gruppere'],
    [/^Double subscripts: use braces to clarify$/, 'dobbel senket skrift, bruk { } for å gruppere'],
    [/^Misplaced (.+)$/, 'feilplassert $1'],
    [/^Missing (.+) inserted$/, 'mangler $1'],
    [/^Unknown environment '(.+)'$/, 'ukjent miljø $1'],
    [/^Extra \\right$/, '\\right uten \\left'],
    [/^Missing argument for (.+)$/, 'mangler argument til $1']
  ];
  const translateTexError = msg => { msg = String(msg || '').trim(); for (const [re, rep] of TEX_ERR) if (re.test(msg)) return msg.replace(re, rep); return msg || 'ukjent feil'; };

  function texNode(tex, display, cell) {
    state.stats.math++;
    if (!state.mathOk) { const s = el(display ? 'div' : 'span', 'math-raw'); s.textContent = display ? `$$${tex}$$` : `$${tex}$`; return s; }
    let node, err = null;
    try {
      node = MathJax.tex2svg(tex, { display });
      const bad = node.querySelector('[data-mjx-error], [data-mml-node="merror"]');
      if (bad) err = bad.getAttribute('data-mjx-error') || bad.getAttribute('title') || bad.textContent;
    } catch (e) { err = e.message || String(e); }
    if (err == null) {
      node.dataset.tex = tex.trim();
      if (display) node.dataset.display = '1';
      return node;
    }
    state.stats.mathErr++;
    issue('error', 'math', cell, 'LaTeX-feil: ' + translateTexError(err), null, tex.trim());
    const s = el(display ? 'div' : 'span', 'math-fail' + (display ? ' block' : ''));
    s.textContent = display ? tex.trim() : `$${tex}$`;
    return s;
  }

  // ---------- Markdown with protected math ----------
  function splitFences(src) {
    const lines = src.split('\n'), segs = [];
    let buf = [], fence = null;
    const flush = code => { if (buf.length) segs.push({ code, text: buf.join('\n') + '\n' }); buf = []; };
    for (const line of lines) {
      const m = /^ {0,3}(`{3,}|~{3,})/.exec(line);
      if (!fence && m) { flush(false); fence = m[1]; buf.push(line); }
      else if (fence && m && m[1][0] === fence[0] && m[1].length >= fence.length && line.trim() === m[1]) { buf.push(line); flush(true); fence = null; }
      else buf.push(line);
    }
    flush(!!fence);
    return segs;
  }

  function inlineClose(s, k) {
    for (; k < s.length; k++) {
      const ch = s[k];
      if (ch === '\\') { k++; continue; }
      if (ch === '$') return k;
      if (ch === '`') return -1;
      if (ch === '\n' && /^[ \t]*\n/.test(s.slice(k + 1, k + 60))) return -1;
    }
    return -1;
  }

  function extractMath(src, cell) {
    const math = [];
    let lone = false, unclosed = false, out = '';
    const put = (tex, display) => { math.push({ tex, display }); return `@@M${math.length - 1}@@`; };
    for (const seg of splitFences(src)) {
      if (seg.code) { out += seg.text; continue; }
      const s = seg.text;
      let i = 0;
      while (i < s.length) {
        const c = s[i];
        if (c === '\\') {
          const nx = s[i + 1];
          if (nx === '(' || nx === '[') {
            const j = s.indexOf(nx === '(' ? '\\)' : '\\]', i + 2);
            if (j >= 0) { out += put(s.slice(i + 2, j), nx === '['); i = j + 2; continue; }
          } else if (s.startsWith('\\begin{', i)) {
            const m = /^\\begin\{([A-Za-z]+\*?)\}/.exec(s.slice(i, i + 40));
            if (m && MATH_ENV.test(m[1])) {
              const end = `\\end{${m[1]}}`, j = s.indexOf(end, i);
              if (j >= 0) { out += put(s.slice(i, j + end.length), true); i = j + end.length; continue; }
            }
          }
          out += c + (nx === undefined ? '' : nx); i += 2; continue;
        }
        if (c === '`') {
          let r = 1; while (s[i + r] === '`') r++;
          let j = i + r, found = -1;
          while ((j = s.indexOf('`', j)) >= 0) {
            let rr = 0; while (s[j + rr] === '`') rr++;
            if (rr === r) { found = j; break; }
            j += rr;
          }
          if (found >= 0) { out += s.slice(i, found + r); i = found + r; } else { out += s.slice(i, i + r); i += r; }
          continue;
        }
        if (c === '$') {
          if (s[i + 1] === '$') {
            const j = s.indexOf('$$', i + 2);
            if (j >= 0) { out += put(s.slice(i + 2, j), true); i = j + 2; continue; }
            unclosed = true; out += '$$'; i += 2; continue;
          }
          const j = inlineClose(s, i + 1);
          if (j > i + 1) { out += put(s.slice(i + 1, j), false); i = j + 1; continue; }
          lone = true; out += '$'; i++; continue;
        }
        out += c; i++;
      }
    }
    if (unclosed) issue('warn', 'text', cell, '$$ mangler avslutning', 'En formel som starter med $$ må også slutte med $$.');
    if (lone) issue('warn', 'text', cell, 'Enslig $-tegn', 'Mener du et dollartegn, skriv \\$. Ellers mangler det et $ som avslutter formelen.');
    return { text: out, math };
  }

  // Images are resolved inside DOMPurify's inert document, so missing files are never requested.
  let imgCtx = null;
  if (window.DOMPurify) DOMPurify.addHook('afterSanitizeAttributes', node => {
    if (!imgCtx || node.nodeName !== 'IMG') return;
    const src = (node.getAttribute('src') || '').trim();
    if (src.startsWith('data:')) return;
    if (src.startsWith('attachment:') && imgCtx.attachments) {
      let name = src.slice(11);
      try { name = decodeURIComponent(name); } catch (e) { /* keep raw name */ }
      const att = imgCtx.attachments[name];
      const mime = att && Object.keys(att).find(k => k.startsWith('image/'));
      if (mime) {
        node.setAttribute('src', mime === 'image/svg+xml' ? svgUri(joinSrc(att[mime])) : `data:${mime};base64,${joinSrc(att[mime]).replace(/\s/g, '')}`);
        return;
      }
    }
    node.setAttribute('data-missing', src || '(uten adresse)');
    node.removeAttribute('src'); node.removeAttribute('srcset');
  });
  function sanitize(html, attachments) {
    imgCtx = { attachments: attachments || null };
    try { return DOMPurify.sanitize(html, PURIFY); } finally { imgCtx = null; }
  }

  function mdToNode(src, cell, attachments) {
    const { text, math } = extractMath(src, cell);
    const box = el('div', 'nb-md');
    box.innerHTML = sanitize(marked.parse(text, { gfm: true, breaks: false }), attachments);
    if (math.length) {
      const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      const hits = []; let n;
      while ((n = walker.nextNode())) if (n.nodeValue.includes('@@M')) hits.push(n);
      for (const t of hits) {
        const parts = t.nodeValue.split(/@@M(\d+)@@/);
        const frag = document.createDocumentFragment();
        parts.forEach((p, k) => {
          if (k % 2 === 0) { if (p) frag.append(p); }
          else if (math[+p]) frag.append(texNode(math[+p].tex, math[+p].display, cell));
        });
        t.replaceWith(frag);
      }
    }
    fixImages(box, cell);
    box.querySelectorAll('a[href]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    return box;
  }

  function fixImages(box, cell) {
    box.querySelectorAll('img[data-missing]').forEach(img => {
      const label = img.getAttribute('data-missing');
      const remote = /^(https?:)?\/\//i.test(label);
      issue('warn', 'text', cell,
        remote ? 'Bilde fra nettet kan ikke tas med' : 'Bildet ligger ikke i notebooken',
        (remote ? `${clip(label, 60)}. Last ned bildet og dra det inn i markdown-cellen i Jupyter.` : `«${clip(label, 60)}» er en egen fil. Dra bildet inn i markdown-cellen i Jupyter, så lagres det i notebooken.`));
      const ph = el('span', 'nb-missing'); ph.textContent = `Bilde mangler: ${label}`;
      img.replaceWith(ph);
    });
  }

  // ---------- code and outputs ----------
  function highlight(src, lang) {
    if (window.hljs && hljs.getLanguage(lang)) {
      try { return hljs.highlight(src, { language: lang, ignoreIllegals: true }).value; } catch (e) { /* fall through */ }
    }
    return esc(src);
  }

  // Split highlighted HTML (only <span> tags) into lines, re-opening spans that cross line ends.
  function splitHtmlLines(html) {
    const lines = [], stack = [];
    let cur = '', m;
    const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)|(<)/g;
    while ((m = re.exec(html))) {
      if (m[1]) { stack.push(m[1]); cur += m[1]; }
      else if (m[2]) { stack.pop(); cur += m[2]; }
      else if (m[3]) { lines.push(cur + '</span>'.repeat(stack.length)); cur = stack.join(''); }
      else cur += m[0];
    }
    lines.push(cur + '</span>'.repeat(stack.length));
    return lines;
  }
  const linesHtml = lines => lines.map(l => `<span class="nb-ln">${l}</span>`).join('');

  const ANSI_FG = ['#1b2130', '#c4302b', '#2a7a3a', '#8a6100', '#1f58b8', '#8e2aa3', '#0b7480', '#5d6675'];
  const ANSI_BRIGHT = ['#5d6675', '#d83b34', '#38964a', '#a07400', '#3a72d4', '#a63fbf', '#128c9a', '#7f8899'];
  const ANSI_BG = ['#e3e6ec', '#fbe1df', '#e0f1e3', '#fbf0d2', '#e0e9fa', '#f3e1f7', '#ddf1f3', '#f1f2f5'];
  function xterm(n) {
    if (n < 8) return ANSI_FG[n];
    if (n < 16) return ANSI_BRIGHT[n - 8];
    if (n < 232) { const v = [0, 95, 135, 175, 215, 255], q = n - 16; return `rgb(${v[Math.floor(q / 36)]},${v[Math.floor(q / 6) % 6]},${v[q % 6]})`; }
    const g = 8 + (n - 232) * 10; return `rgb(${g},${g},${g})`;
  }
  function ansiToHtml(text) {
    const clean = text
      .replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g, '')
      .replace(/\x1b\[[0-9;?]*[A-La-ln-z]/g, '')
      .replace(/[\x00-\x08\x0b\x0c\x0e-\x1a\x1c-\x1f]/g, '');
    const parts = clean.split(/\x1b\[([0-9;]*)m/);
    const st = { fg: null, bg: null, bold: false };
    let style = '', html = '';
    parts.forEach((p, i) => {
      if (i % 2 === 0) { if (p) html += style ? `<span style="${style}">${esc(p)}</span>` : esc(p); return; }
      const codes = p === '' ? [0] : p.split(';').map(Number);
      for (let k = 0; k < codes.length; k++) {
        const c = codes[k];
        if (c === 0) { st.fg = null; st.bg = null; st.bold = false; }
        else if (c === 1) st.bold = true;
        else if (c === 22) st.bold = false;
        else if (c >= 30 && c <= 37) st.fg = ANSI_FG[c - 30];
        else if (c >= 90 && c <= 97) st.fg = ANSI_BRIGHT[c - 90];
        else if (c === 39) st.fg = null;
        else if (c >= 40 && c <= 47) st.bg = ANSI_BG[c - 40];
        else if (c >= 100 && c <= 107) st.bg = ANSI_BG[c - 100];
        else if (c === 49) st.bg = null;
        else if (c === 38 || c === 48) {
          let col = null;
          if (codes[k + 1] === 5) { col = xterm(codes[k + 2] || 0); k += 2; }
          else if (codes[k + 1] === 2) { col = `rgb(${codes[k + 2] || 0},${codes[k + 3] || 0},${codes[k + 4] || 0})`; k += 4; }
          if (c === 38) st.fg = col; else st.bg = col && ANSI_BG[7];
        }
      }
      style = (st.fg ? `color:${st.fg};` : '') + (st.bold ? 'font-weight:600;' : '') + (st.bg ? `background:${st.bg};` : '');
    });
    return html;
  }
  const stripAnsi = t => t.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, '');

  function applyCR(t) {
    if (!t.includes('\r')) return t;
    return t.split('\n').map(line => {
      if (!line.includes('\r')) return line;
      const segs = line.split('\r');
      for (let i = segs.length - 1; i >= 0; i--) if (segs[i] !== '') return segs[i];
      return '';
    }).join('\n');
  }

  function textBlock(text, cls, cell) {
    text = text.replace(/\t/g, '    ').replace(/\n+$/, '');
    let lines = splitHtmlLines(ansiToHtml(text));
    const n = lines.length;
    if (n > LONG_OUTPUT) {
      if (els.trunc.checked) {
        lines = [...lines.slice(0, TRUNC_HEAD), `<span class="nb-trunc">… ${n - TRUNC_HEAD - TRUNC_TAIL} linjer er utelatt …</span>`, ...lines.slice(-TRUNC_TAIL)];
      } else {
        const pages = Math.max(1, Math.round(n * 18.75 / PAGE_H));
        issue('warn', 'output', cell, `Lang utdata: ${n} linjer`, `Tar omtrent ${pages} ${pages === 1 ? 'side' : 'sider'}. Slå på «Forkort lange utdata», eller skriv ut mindre i koden.`);
      }
    }
    const pre = el('pre', cls);
    pre.innerHTML = linesHtml(lines);
    return pre;
  }

  function placeholder(text) { const d = el('div', 'nb-missing'); d.textContent = text; return d; }

  function latexBlock(s, cell) {
    s = s.trim();
    const m = /^\$\$([\s\S]*)\$\$$/.exec(s) || /^\$([\s\S]*)\$$/.exec(s) || /^\\\[([\s\S]*)\\\]$/.exec(s) || /^\\\(([\s\S]*)\\\)$/.exec(s);
    const box = el('div', 'nb-out-math');
    if (m && !m[1].includes('$')) box.append(texNode(m[1], true, cell));
    else if (/^\\begin\{/.test(s)) box.append(texNode(s, true, cell));
    else box.append(mdToNode(s, cell, null));
    return box;
  }

  function renderMime(o, cell) {
    const d = o.data || {}, meta = o.metadata || {};
    const html = d['text/html'] != null ? joinSrc(d['text/html']) : null;
    const htmlInteractive = html != null && /<script|<iframe/i.test(html);
    const imgMime = ['image/png', 'image/jpeg', 'image/gif', 'image/svg+xml'].find(k => d[k] != null);
    const keys = Object.keys(d);

    if (d['text/latex'] != null) return latexBlock(joinSrc(d['text/latex']), cell);
    if (html != null && !htmlInteractive) {
      const box = el('div', 'nb-html');
      box.innerHTML = sanitize(html, null);
      fixImages(box, cell);
      return box;
    }
    if (imgMime) {
      const raw = joinSrc(d[imgMime]);
      const img = new Image();
      img.className = 'nb-img'; img.alt = '';
      img.src = imgMime === 'image/svg+xml' ? svgUri(raw) : `data:${imgMime};base64,${raw.replace(/\s/g, '')}`;
      const im = meta[imgMime] || {};
      if (im.width) img.style.width = Math.min(im.width, DOC_W) + 'px';
      state.stats.images++;
      return img;
    }
    if (d['text/markdown'] != null) return mdToNode(joinSrc(d['text/markdown']), cell, null);
    const widget = keys.some(k => k.includes('widget-view'));
    const interactive = widget || htmlInteractive || keys.some(k => /plotly|vegalite|vega\+json|bokeh|holoviews|geo\+json/.test(k));
    if (interactive) {
      const what = widget ? 'Interaktiv widget' : keys.some(k => k.includes('plotly')) ? 'Interaktiv Plotly-figur' : 'Interaktiv figur';
      issue('warn', 'output', cell, `${what} kan ikke vises i PDF`, 'Lag en statisk figur, for eksempel med matplotlib, eller lagre figuren som bilde og vis bildet.');
      return placeholder(`${what} vises ikke i PDF`);
    }
    if (d['text/plain'] != null) return textBlock(applyCR(joinSrc(d['text/plain'])), 'nb-text', cell);
    return null;
  }

  function mergeStreams(outputs) {
    const res = [];
    for (const o of outputs) {
      const prev = res[res.length - 1];
      if (o.output_type === 'stream' && prev && prev.output_type === 'stream' && prev.name === o.name) prev.text = joinSrc(prev.text) + joinSrc(o.text);
      else res.push(o.output_type === 'stream' ? { ...o, text: joinSrc(o.text) } : o);
    }
    return res;
  }

  function renderOutput(o, cell) {
    if (o.output_type === 'stream') {
      const text = applyCR(joinSrc(o.text));
      if (!text.trim()) return null;
      state.stats.outputs++;
      if (o.name === 'stderr') issue('warn', 'output', cell, 'Advarsel eller melding fra Python (stderr)', clip(stripAnsi(text).split('\n').find(l => l.trim()) || '', 110));
      return textBlock(text, o.name === 'stderr' ? 'nb-text nb-stderr' : 'nb-text', cell);
    }
    if (o.output_type === 'error') {
      state.stats.outputs++; state.stats.errors++;
      issue('error', 'output', cell, `Koden stopper med ${o.ename || 'en feil'}`, (o.evalue ? clip(stripAnsi(o.evalue), 110) + '. ' : '') + 'Rett feilen og kjør cellen på nytt.');
      const tb = (o.traceback && o.traceback.length) ? o.traceback.join('\n') : `${o.ename}: ${o.evalue}`;
      return textBlock(tb, 'nb-text nb-error', cell);
    }
    if (o.output_type === 'execute_result' || o.output_type === 'display_data') {
      const node = renderMime(o, cell);
      if (node) state.stats.outputs++;
      return node;
    }
    return null;
  }

  function renderCodeCell(cell, idx, lang) {
    const src = joinSrc(cell.source).replace(/\t/g, '    ').replace(/\s+$/, '');
    const outs = mergeStreams(cell.outputs || []);
    const box = el('section', 'nb-cell nb-codecell');
    box.id = 'cell-' + idx;
    const ec = cell.execution_count;
    if (els.code.checked && src) {
      state.stats.code++;
      const row = el('div', 'nb-row');
      row.append(el('div', 'nb-prompt', `[${ec == null ? '&nbsp;' : esc(ec)}]:`));
      const body = el('div', 'nb-body'), inBox = el('div', 'nb-in'), pre = el('pre', 'nb-code');
      pre.innerHTML = linesHtml(splitHtmlLines(highlight(src, lang)));
      inBox.append(pre); body.append(inBox); row.append(body); box.append(row);
    }
    if (els.out.checked) {
      for (const o of outs) {
        const node = renderOutput(o, idx);
        if (!node) continue;
        const row = el('div', 'nb-row');
        const isResult = o.output_type === 'execute_result';
        row.append(el('div', 'nb-prompt out', isResult ? `[${esc(o.execution_count ?? ec ?? '')}]:` : ''));
        const body = el('div', 'nb-body');
        body.append(node); row.append(body); box.append(row);
      }
    }
    return box.childElementCount ? box : null;
  }

  function runOrderCheck(nb) {
    if (!els.code.checked && !els.out.checked) return;
    const code = nb.cells.map((c, idx) => ({ c, idx })).filter(x => x.c.cell_type === 'code' && joinSrc(x.c.source).trim());
    if (!code.length) return;
    const notRun = code.filter(x => x.c.execution_count == null);
    if (notRun.length === code.length) {
      issue('warn', 'code', code[0].idx, 'Ingen celler er kjørt', 'Notebooken er lagret uten resultater. Kjør alle cellene i Jupyter og lagre før du lager PDF.');
      return;
    }
    if (notRun.length) {
      const list = notRun.slice(0, 6).map(x => x.idx + 1).join(', ') + (notRun.length > 6 ? ' …' : '');
      issue('warn', 'code', notRun[0].idx, notRun.length === 1 ? 'En celle er ikke kjørt' : `${notRun.length} celler er ikke kjørt`, (notRun.length > 1 ? `Celle ${list}. ` : '') + 'Kjør alle cellene (Run All) før du lager PDF.');
    }
    const ran = code.filter(x => x.c.execution_count != null);
    const bad = ran.find((x, k) => k > 0 && x.c.execution_count <= ran[k - 1].c.execution_count);
    if (bad) issue('warn', 'code', bad.idx, 'Cellene er kjørt i en annen rekkefølge enn de står i', 'Velg Restart & Run All i Jupyter, så stemmer resultatene med rekkefølgen i PDF-en.');
  }

  // ---------- layout checks after rendering ----------
  function topIn(node) { let y = 0; while (node && node !== els.inner) { y += node.offsetTop; node = node.offsetParent; } return y; }

  function measureLayout() {
    const firstLn = els.inner.querySelector('.nb-in .nb-ln');
    if (firstLn) {
      const lh = parseFloat(getComputedStyle(firstLn).lineHeight) || 18.75;
      const probe = el('span'); probe.textContent = '0'.repeat(80);
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
      firstLn.parentElement.append(probe);
      const cw = probe.getBoundingClientRect().width / 80 / (state.scale || 1);
      probe.remove();
      state.cols = Math.max(20, Math.floor(firstLn.parentElement.clientWidth / cw));
      els.inner.querySelectorAll('.nb-codecell').forEach(cell => {
        let n = 0;
        cell.querySelectorAll('.nb-in .nb-ln').forEach(ln => { if (ln.offsetHeight > lh * 1.4) n++; });
        if (n) issue('warn', 'code', +cell.id.slice(5), n === 1 ? 'En kodelinje er for lang og brytes' : `${n} kodelinjer er for lange og brytes`, `Det er plass til omtrent ${state.cols} tegn per linje. Del opp lange linjer for et ryddigere resultat.`);
      });
    }
    els.inner.querySelectorAll('.nb-html table, .nb-md table').forEach(t => {
      const box = t.parentElement;
      for (const size of [12.5, 11.5, 10.5, 9.5]) {
        if (t.offsetWidth <= box.clientWidth + 1) break;
        t.style.fontSize = size + 'px';
      }
      if (t.offsetWidth > box.clientWidth + 1) {
        const cell = t.closest('.nb-cell');
        issue('warn', cell && cell.classList.contains('nb-codecell') ? 'output' : 'text', cell ? +cell.id.slice(5) : null, 'Tabellen er for bred og blir kuttet', 'Vis færre kolonner, for eksempel df.iloc[:, :6], eller rund av tallene med df.round(3).');
      }
    });
    els.inner.querySelectorAll('mjx-container[display="true"]').forEach(mc => {
      const svg = mc.firstElementChild;
      if (svg && svg.getBoundingClientRect().width / (state.scale || 1) > mc.clientWidth + 2) {
        const cell = mc.closest('.nb-cell');
        issue('warn', 'math', cell ? +cell.id.slice(5) : null, 'Formelen er bredere enn siden', 'Del den over flere linjer, for eksempel med \\begin{align} … \\end{align}.');
      }
    });
  }

  function computePages() {
    const total = els.inner.offsetHeight;
    const cands = new Map(), tops = [];
    const add = (y, w) => { y = Math.round(y); cands.set(y, Math.max(cands.get(y) || 0, w)); };
    els.inner.querySelectorAll('.nb-cell, .nb-title').forEach(c => { const t = topIn(c); add(t, 3); add(t + c.offsetHeight, 3); tops.push(t); });
    els.inner.querySelectorAll('.nb-ln, .nb-md p, .nb-md li, .doc tr, .nb-md blockquote, .nb-md pre, .nb-md hr, .nb-html, .nb-img, .nb-md img, mjx-container[display="true"], .math-fail.block, .nb-missing, .nb-in, .nb-text, .nb-out-math').forEach(n => {
      const t = topIn(n); add(t + n.offsetHeight, 1); tops.push(t);
    });
    els.inner.querySelectorAll('.nb-md h1, .nb-md h2, .nb-md h3, .nb-md h4, .nb-md h5, .nb-md h6').forEach(h => { const t = topIn(h); add(t, 2); tops.push(t); cands.delete(Math.round(t + h.offsetHeight)); });
    const ys = [...cands.keys()].sort((a, b) => a - b);
    tops.sort((a, b) => a - b);
    const pages = [];
    let start = 0, guard = 0;
    while (total - start > PAGE_H + 1 && guard++ < 500) {
      const limit = start + PAGE_H;
      let best = -1, bestCell = -1;
      for (const y of ys) {
        if (y <= start + 120) continue;
        if (y > limit) break;
        best = y;
        if (cands.get(y) >= 2) bestCell = y;
      }
      let cut = best > 0 ? best : limit;
      if (bestCell > 0 && bestCell >= start + PAGE_H * 0.82) cut = bestCell;
      pages.push([start, cut]);
      const next = tops.find(t => t >= cut && t < cut + 48);
      start = next != null ? next : cut;
    }
    pages.push([start, Math.max(start + 1, total)]);
    state.pages = pages;
  }

  function drawMarkers() {
    els.paper.querySelectorAll('.pb').forEach(n => n.remove());
    const padTop = parseFloat(getComputedStyle(els.paper).paddingTop) || 0;
    state.pages.slice(0, -1).forEach(([, end], k) => {
      const m = el('div', 'pb', `<span>Side ${k + 2}</span>`);
      m.style.top = (padTop + end + 3) + 'px';
      els.paper.append(m);
    });
    const n = state.pages.length;
    els.pageCount.textContent = `${n} ${n === 1 ? 'side' : 'sider'} A4`;
  }

  let lastW = 0;
  function fit(force) {
    const avail = els.wrap.parentElement.clientWidth;
    if (!force && avail === lastW) return;
    lastW = avail;
    const w = els.paper.offsetWidth;
    const s = Math.min(1, avail / w);
    state.scale = s;
    els.paper.style.transform = s < 1 ? `scale(${s})` : '';
    els.wrap.style.width = Math.floor(w * s) + 'px';
    els.wrap.style.height = Math.ceil(els.paper.offsetHeight * s) + 'px';
  }

  // ---------- check panel ----------
  function renderChecks() {
    const s = state.stats, list = state.issues;
    const levelOf = cat => { const l = list.filter(i => i.cat === cat); return l.some(i => i.level === 'error') ? 'error' : l.length ? 'warn' : 'ok'; };
    const pillText = { ok: 'OK', warn: 'Sjekk', error: 'Feil', off: 'Av' };
    const rows = [
      ['Kode', els.code.checked ? levelOf('code') : 'off', !els.code.checked ? 'Skjult i PDF' : s.code ? `${s.code} ${s.code === 1 ? 'kodecelle' : 'kodeceller'}` : 'Ingen kodeceller'],
      ['Matematikk', levelOf('math'), !state.mathOk && s.math ? 'Kunne ikke lastes' : s.math ? (s.mathErr ? `${s.mathErr} av ${s.math} formler har feil` : `${s.math} ${s.math === 1 ? 'formel' : 'formler'} satt riktig`) : 'Ingen formler'],
      ['Tekst', levelOf('text'), s.md ? `${s.md} ${s.md === 1 ? 'tekstcelle' : 'tekstceller'}` : 'Ingen tekstceller'],
      ['Utdata', els.out.checked ? levelOf('output') : 'off', !els.out.checked ? 'Skjult i PDF' : s.outputs ? `${s.outputs} utdata` + (s.images ? `, ${s.images} ${s.images === 1 ? 'figur' : 'figurer'}` : '') : 'Ingen utdata']
    ];
    els.summary.innerHTML = rows.map(([k, st, v]) => `<li><span class="k">${k}</span><span class="v">${esc(v)}</span><span class="pill" data-state="${st}">${pillText[st]}</span></li>`).join('');

    els.issueBox.replaceChildren();
    if (!list.length) { els.issueBox.append(el('p', 'all-good', 'Alt ser bra ut. PDF-en er klar.')); return; }
    const sorted = [...list].sort((a, b) => (a.cell ?? -1) - (b.cell ?? -1) || (a.level === 'error' ? -1 : 1));
    const ol = el('ol', 'issues');
    for (const it of sorted) {
      const b = el('button', 'issue');
      b.type = 'button'; b.dataset.level = it.level;
      b.innerHTML = `<span class="sev">${it.level === 'error' ? 'Feil' : 'Sjekk'}</span><span class="msg">${esc(it.msg)}</span>`
        + `<span class="where">${it.cell == null ? 'Hele notebooken' : 'Celle ' + (it.cell + 1)}</span>`
        + (it.tex ? `<span class="detail"><code>${esc(clip(it.tex, 140))}</code></span>` : '')
        + (it.detail ? `<span class="detail">${esc(it.detail)}</span>` : '');
      if (it.cell != null) b.addEventListener('click', () => goToCell(it.cell, it.tex));
      const li = el('li'); li.append(b); ol.append(li);
    }
    els.issueBox.append(ol);
    els.issueBox.append(el('p', 'check-note', 'Klikk på et punkt for å se det i forhåndsvisningen. PDF-en kan lages selv om sjekken finner noe.'));
  }

  function goToCell(idx, tex) {
    const cell = document.getElementById('cell-' + idx);
    if (!cell) return;
    let target = cell;
    if (tex) { const f = [...cell.querySelectorAll('.math-fail')].find(n => n.textContent.includes(tex.trim().slice(0, 30))); if (f) target = f; }
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    target.classList.remove('nb-flash'); void target.offsetWidth; target.classList.add('nb-flash');
    setTimeout(() => target.classList.remove('nb-flash'), 1900);
  }

  // ---------- render pipeline ----------
  async function settle() {
    void els.inner.offsetHeight;
    const imgs = [...els.inner.querySelectorAll('img')];
    await Promise.all(imgs.map(img => img.complete
      ? (img.decode ? img.decode().catch(() => {}) : null)
      : new Promise(r => { img.onload = img.onerror = r; })));
    try { await Promise.race([document.fonts.ready, sleep(3000)]); } catch (e) { /* fonts are optional */ }
  }

  async function render() {
    if (!state.nb) return;
    const token = ++state.token;
    els.pdfBtn.disabled = true;
    hideSaveLink();
    state.issues = [];
    state.stats = { code: 0, md: 0, math: 0, mathErr: 0, outputs: 0, images: 0, errors: 0 };
    state.mathOk = await waitMath();
    if (token !== state.token) return;
    if (state.mathOk) { try { MathJax.texReset(); } catch (e) { /* first run */ } }

    const nb = state.nb;
    const lang = String((nb.metadata && nb.metadata.language_info && nb.metadata.language_info.name) || (nb.metadata && nb.metadata.kernelspec && nb.metadata.kernelspec.language) || 'python').toLowerCase();
    const frag = document.createDocumentFragment();
    const title = els.title.value.trim(), author = els.author.value.trim();
    if (title || author) {
      const head = el('header', 'nb-title');
      if (title) head.append(el('h1', '', esc(title)));
      const date = new Date().toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' });
      head.append(el('div', 'meta', esc([author, date].filter(Boolean).join(' · '))));
      frag.append(head);
    }
    nb.cells.forEach((cell, idx) => {
      try {
        if (cell.cell_type === 'markdown') {
          const src = joinSrc(cell.source);
          if (!src.trim()) return;
          state.stats.md++;
          const box = el('section', 'nb-cell nb-mdcell');
          box.id = 'cell-' + idx;
          box.append(mdToNode(src, idx, cell.attachments));
          frag.append(box);
        } else if (cell.cell_type === 'code') {
          const node = renderCodeCell(cell, idx, lang);
          if (node) frag.append(node);
        }
      } catch (e) {
        issue('error', 'text', idx, 'Cellen kunne ikke vises', clip(e.message || e, 120));
      }
    });
    runOrderCheck(nb);
    if (!state.mathOk && state.stats.math) issue('error', 'math', null, 'Matematikken kunne ikke lastes', 'Sjekk nettforbindelsen og last siden på nytt. Formlene vises nå som rå LaTeX.');
    if (!frag.childNodes.length) frag.append(el('p', 'nb-empty', 'Notebooken har ingen celler med innhold.'));
    els.doc.classList.toggle('no-prompts', !els.prompts.checked);
    els.inner.replaceChildren(frag);

    await settle();
    if (token !== state.token) return;
    measureLayout();
    computePages();
    drawMarkers();
    fit(true);
    renderChecks();
    els.pdfBtn.disabled = state.busy;
  }

  let timer = 0;
  const scheduleRender = (delay = 0) => { clearTimeout(timer); timer = setTimeout(render, delay); };

  // ---------- loading files ----------
  function loadText(text, name, sample) {
    let nb;
    try { nb = JSON.parse(text); } catch (e) { status('Filen kunne ikke leses som en notebook. Er det en .ipynb-fil?', 'error'); return; }
    if (!nb || !Array.isArray(nb.cells)) {
      status(nb && nb.worksheets ? 'Dette er et gammelt notebook-format (v3). Åpne og lagre filen i en nyere Jupyter først.' : 'Fant ingen celler i filen. Er det en Jupyter-notebook?', 'error');
      return;
    }
    state.nb = nb; state.fileName = name;
    els.fileName.textContent = sample ? `${name} (eksempel)` : name;
    els.title.value = '';
    status(sample ? 'Viser en eksempelnotebook. Velg din egen fil for å komme i gang.' : '', '');
    scheduleRender();
  }

  async function readFile(f) {
    if (!f) return;
    if (!/\.ipynb$/i.test(f.name) && !/json/.test(f.type)) { status(`«${f.name}» er ikke en .ipynb-fil.`, 'error'); return; }
    try { loadText(await f.text(), f.name, false); } catch (e) { status('Kunne ikke lese filen.', 'error'); }
  }

  els.file.addEventListener('change', () => { readFile(els.file.files[0]); els.file.value = ''; });
  let dragDepth = 0;
  document.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; els.drop.classList.add('over'); } });
  document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; els.drop.classList.remove('over'); } });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; els.drop.classList.remove('over');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  [els.code, els.out, els.prompts, els.trunc].forEach(c => c.addEventListener('change', () => scheduleRender()));
  [els.title, els.author].forEach(i => i.addEventListener('input', () => scheduleRender(250)));

  // ---------- PDF ----------
  // Standard PDF fonts only cover Latin-1; map common Unicode punctuation and fall back to base letters.
  const PUNCT = { '−': '-', '–': '-', '—': '-', '‐': '-', '‘': "'", '’': "'", '“': '"', '”': '"', '…': '...', '•': '*', ' ': ' ', ' ': ' ', '​': '', '→': '->', '←': '<-', '⇌': '<=>', '⟶': '->' };
  const latin1 = s => String(s).normalize('NFC').replace(/[^\x20-\xff]/g, ch => {
    if (ch in PUNCT) return PUNCT[ch];
    const base = ch.normalize('NFKD').replace(/[̀-ͯ]/g, '');
    return [...base].map(c => c in PUNCT ? PUNCT[c] : (c.charCodeAt(0) <= 255 && c.charCodeAt(0) >= 32 ? c : '?')).join('');
  });
  const pdfName = () => (state.fileName || 'notebook.ipynb').replace(/\.ipynb$/i, '') + '.pdf';

  function footer(pdf, n, N) {
    const author = els.author.value.trim();
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(110, 118, 132);
    const left = latin1(author ? `${author}  ·  ${state.fileName}` : state.fileName);
    pdf.text(left, MM.side, MM.pageH - 10);
    pdf.text(`Side ${n} av ${N}`, MM.pageW - MM.side, MM.pageH - 10, { align: 'right' });
  }

  // Positions of every visible line of text (and each formula's LaTeX source), in document px.
  function collectText() {
    const base = els.inner.getBoundingClientRect(), s = state.scale || 1, items = [];
    const range = document.createRange();
    const walker = document.createTreeWalker(els.inner, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (!n.nodeValue.trim() || n.parentElement.closest('mjx-container, svg')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    let n;
    while ((n = walker.nextNode())) {
      const parent = n.parentElement;
      const fs = parseFloat(getComputedStyle(parent).fontSize) || 15;
      const mono = !!parent.closest('pre, code');
      const re = /\s+|\S+/g;
      let m, cur = null;
      while ((m = re.exec(n.nodeValue))) {
        range.setStart(n, m.index); range.setEnd(n, m.index + m[0].length);
        const r = range.getBoundingClientRect();
        if (!r.width && !r.height) { if (cur) cur.text += m[0]; continue; }
        const top = (r.top - base.top) / s, left = (r.left - base.left) / s, w = r.width / s, h = r.height / s;
        if (cur && Math.abs(top - cur.top) < h * 0.5 && left >= cur.left - 1) { cur.text += m[0]; cur.right = Math.max(cur.right, left + w); cur.h = Math.max(cur.h, h); }
        else { if (cur) items.push(cur); cur = { text: m[0], top, left, right: left + w, h, fs, mono }; }
      }
      if (cur) items.push(cur);
    }
    els.inner.querySelectorAll('mjx-container[data-tex]').forEach(mc => {
      const r = (mc.firstElementChild || mc).getBoundingClientRect();
      if (!r.width) return;
      const tex = mc.dataset.tex.replace(/\s+/g, ' ');
      items.push({ math: true, text: mc.dataset.display ? `$$${tex}$$` : ` $${tex}$ `, top: (r.top - base.top) / s, left: (r.left - base.left) / s, right: (r.right - base.left) / s, h: r.height / s, fs: 13, mono: true });
    });
    items.sort((a, b) => (a.top + a.h / 2) - (b.top + b.h / 2) || a.left - b.left);
    return items;
  }

  // Invisible text placed over the page image, so the PDF can be searched and copied.
  function addTextLayer(pdf, items, y0, y1) {
    pdf.setFont('helvetica', 'normal');
    for (const it of items) {
      const cy = it.top + it.h / 2;
      if (cy < y0 || cy >= y1) continue;
      const t = latin1(it.math ? it.text : it.mono ? it.text.replace(/[\r\n]+/g, ' ').replace(/\s+$/, '') : it.text.replace(/\s+/g, ' ').trim());
      if (!t.trim()) continue;
      pdf.setFontSize(it.fs / PX_PER_MM * 72 / 25.4);
      const natural = pdf.getTextWidth(t), target = (it.right - it.left) / PX_PER_MM;
      const hs = natural > 0 ? Math.min(3, Math.max(0.3, target / natural)) : 1;
      pdf.text(t, MM.side + it.left / PX_PER_MM, MM.top + (it.top - y0 + it.h * 0.78) / PX_PER_MM, { renderingMode: 'invisible', horizontalScale: hs });
    }
  }

  function setProgress(frac) {
    els.progress.hidden = frac == null;
    if (frac != null) els.progress.firstElementChild.style.width = Math.round(frac * 100) + '%';
  }

  let saveUrl = null;
  function hideSaveLink() {
    els.saveLink.hidden = true;
    if (saveUrl) { URL.revokeObjectURL(saveUrl); saveUrl = null; }
  }

  async function deliver(blob, name) {
    const dl = await downloadsCap;
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); status(`Lagret ${name}.`, 'ok'); }
      catch (e) {
        const code = e && e.code;
        if (code === 'declined') status('Lagringen ble avbrutt.', '');
        else if (code === 'rate_limited') status('Et lagringsvindu er allerede åpent. Prøv igjen om litt.', 'warn');
        else status('Kunne ikke lagre filen her. ' + ((e && e.message) || ''), 'error');
      }
      return;
    }
    if (window.claude) { status('Nedlasting er ikke tilgjengelig i denne visningen.', 'error'); return; }
    // Outside Claude: a real link. Embedded in an iframe (for example Canvas) the click on the link is what saves the file.
    hideSaveLink();
    saveUrl = URL.createObjectURL(blob);
    const a = els.saveLink;
    a.href = saveUrl; a.download = name;
    a.className = framed ? 'primary' : 'secondary';
    a.textContent = framed ? `Lagre ${name}` : 'Last ned på nytt';
    a.hidden = false;
    if (framed) { status('PDF-en er klar. Trykk på knappen for å lagre den.', 'ok'); a.focus(); return; }
    a.click();
    status(`Lastet ned ${name}.`, 'ok');
  }

  async function makePdf() {
    if (state.busy || !state.nb) return;
    if (!window.html2canvas || !window.jspdf) { status('Verktøyene for PDF kunne ikke lastes. Sjekk nettforbindelsen og last siden på nytt.', 'error'); return; }
    state.busy = true; els.pdfBtn.disabled = true; els.controls.disabled = true;
    hideSaveLink();
    try {
      clearTimeout(timer);
      els.inner.querySelectorAll('.nb-flash').forEach(n => n.classList.remove('nb-flash'));
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
      const firstH = els.inner.querySelector('.nb-md h1');
      pdf.setProperties({ title: latin1(els.title.value.trim() || (firstH ? firstH.textContent : '') || state.fileName), author: latin1(els.author.value.trim()), creator: 'Jupyter til PDF' });
      const items = collectText();
      const N = state.pages.length;
      for (let p = 0; p < N; p++) {
        status(`Lager side ${p + 1} av ${N} …`, ''); setProgress(p / N);
        const [y0, y1] = state.pages[p];
        const h = Math.max(1, Math.ceil(y1 - y0));
        const canvas = await html2canvas(els.doc, {
          scale: RENDER_SCALE, backgroundColor: '#ffffff', logging: false, useCORS: false,
          windowWidth: Math.max(1100, document.documentElement.clientWidth),
          onclone: cdoc => {
            const d = cdoc.getElementById('doc'), inn = cdoc.getElementById('docInner');
            const host = cdoc.createElement('div');
            host.style.cssText = `position:absolute;left:0;top:0;width:${DOC_W}px;background:#fff;z-index:2147483647;`;
            cdoc.body.appendChild(host); host.appendChild(d);
            d.style.height = h + 'px'; d.style.overflow = 'hidden';
            inn.style.marginTop = (-y0) + 'px';
          }
        });
        if (p > 0) pdf.addPage('a4', 'portrait');
        const hMm = canvas.height / RENDER_SCALE / PX_PER_MM;
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', MM.side, MM.top, MM.pageW - 2 * MM.side, hMm);
        addTextLayer(pdf, items, y0, y1);
        footer(pdf, p + 1, N);
        canvas.width = canvas.height = 0;
        await sleep(0);
      }
      setProgress(1);
      status('Gjør klar filen …', '');
      await deliver(pdf.output('blob'), pdfName());
    } catch (e) {
      status('Kunne ikke lage PDF: ' + ((e && e.message) || e), 'error');
    } finally {
      state.busy = false; els.pdfBtn.disabled = false; els.controls.disabled = false;
      setTimeout(() => setProgress(null), 600);
    }
  }

  els.pdfBtn.addEventListener('click', makePdf);

  // ---------- start ----------
  new ResizeObserver(() => fit(false)).observe(els.wrap.parentElement);
  if (document.fonts && document.fonts.load) {
    ['400 15px "Source Serif 4"', '600 15px "Source Serif 4"', 'italic 400 15px "Source Serif 4"', '400 12.5px "JetBrains Mono"', '600 12.5px "JetBrains Mono"'].forEach(f => document.fonts.load(f).catch(() => {}));
  }
  try { loadText(document.getElementById('sampleNb').textContent, 'kinetikk-h2o2.ipynb', true); }
  catch (e) { status('Velg en .ipynb-fil for å starte.', ''); }
})();
</script>

</body>
